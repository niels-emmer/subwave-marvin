name: Bug report
description: Report something that is not working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please **do not include secrets, your
        station's credentials, hostnames, or instance data** in this issue — redact them
        first. Security problems belong in a
        [private report](https://github.com/niels-emmer/subwave-marvin/security/advisories/new),
        not here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact command, and the tier it reported.
      placeholder: |
        1. `python3 scripts/subwave.py diff`
        2. ...
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Which tier was the command running at?
      description: Every command prints this. It decides whether reads are trimmed.
      options:
        - Tier 1 — HTTP only
        - Tier 2 — HTTP plus host access (ssh + docker exec)
        - Not sure / the command failed before it said
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact credentials, hostnames, IP addresses, and station or persona names you would rather not publish.
      render: shell
    validations:
      required: false
